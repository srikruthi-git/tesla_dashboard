<div class="login">
  <div class="login__panel">
    <div class="login__brand">Tesla Energy</div>
    <h1>Secure Operations Access</h1>
    <p>Sign in with your Tesla Energy workforce credentials.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span>Email</span>
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
        />
      </label>

      <label class="field">
        <span>Password</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
      </label>

      <label class="field field--row">
        <input type="checkbox" formControlName="remember" />
        <span>Remember this device for 14 days</span>
      </label>

      <button type="submit" class="login__button" [disabled]="isSubmitting()">
        @if (isSubmitting()) {
          <span class="spinner" aria-hidden="true"></span>
          Signing in...
        } @else {
          Sign in
        }
      </button>
    </form>
  </div>
</div>
